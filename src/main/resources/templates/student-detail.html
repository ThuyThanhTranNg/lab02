<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Chi tiết sinh viên</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow mx-auto" style="max-width: 500px;">
        <div class="card-header bg-primary text-white text-center">
            <h4>CHI TIẾT SINH VIÊN</h4>
        </div>
        <div class="card-body">
            <p><strong>ID:</strong> <span th:text="${student.id}"></span></p>
            <p><strong>Họ tên:</strong> <span th:text="${student.name}"></span></p>
            <p><strong>Tuổi:</strong> <span th:text="${student.age}"></span></p>
            <p><strong>Email:</strong> <span th:text="${student.email}"></span></p>
            <p><strong>Giới tính:</strong> <span th:text="${student.gender}"></span></p>

            <a href="/students" class="btn btn-secondary w-100 mt-3">
                ⬅ Quay lại
            </a>
        </div>
    </div>
</div>

</body>
</html>
