<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Thêm sinh viên</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5">
    <h2>Thêm sinh viên</h2>

    <form th:action="@{/students/save}" th:object="${student}" method="post">

        <div class="mb-3">
            <label>Họ tên</label>
            <input type="text" class="form-control" th:field="*{name}" required>
        </div>

        <div class="mb-3">
            <label>Tuổi</label>
            <input type="number" class="form-control" th:field="*{age}" required>
        </div>

        <div class="mb-3">
            <label>Email</label>
            <input type="email" class="form-control" th:field="*{email}">
        </div>

        <div class="mb-3">
            <label>Giới tính</label>
            <select class="form-control" th:field="*{gender}">
                <option value="Nam">Nam</option>
                <option value="Nữ">Nữ</option>
            </select>
        </div>

        <div class="mb-3">
            <label>Lớp</label>
            <input type="text" class="form-control" th:field="*{className}">
        </div>

        <button type="submit" class="btn btn-success">Lưu</button>
        <a href="/students" class="btn btn-secondary">Quay lại</a>
    </form>
</div>
</body>
</html>
