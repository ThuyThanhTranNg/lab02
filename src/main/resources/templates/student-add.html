<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Thêm sinh viên</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background: #f0f4f8;
            font-family: 'Be Vietnam Pro', sans-serif;
            min-height: 100vh;
        }

        .form-card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
            padding: 40px;
            max-width: 600px;
            margin: 50px auto;
        }

        .form-card h2 {
            font-weight: 700;
            font-size: 1.6rem;
            color: #1a202c;
            margin-bottom: 8px;
        }

        .form-card .subtitle {
            color: #718096;
            font-size: 0.9rem;
            margin-bottom: 28px;
        }

        label {
            font-weight: 600;
            font-size: 0.875rem;
            color: #2d3748;
            margin-bottom: 6px;
        }

        .form-control, .form-select {
            border-radius: 10px;
            border: 1.5px solid #e2e8f0;
            padding: 10px 14px;
            font-size: 0.95rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-control:focus, .form-select:focus {
            border-color: #4f8ef7;
            box-shadow: 0 0 0 3px rgba(79,142,247,0.15);
        }

        .form-control.is-invalid, .form-select.is-invalid {
            border-color: #e53e3e;
            background-image: none;
        }

        .form-control.is-valid, .form-select.is-valid {
            border-color: #38a169;
            background-image: none;
        }

        .invalid-feedback {
            font-size: 0.82rem;
            color: #e53e3e;
            margin-top: 5px;
        }

        .valid-feedback {
            font-size: 0.82rem;
            color: #38a169;
            margin-top: 5px;
        }

        .btn-save {
            background: #4f8ef7;
            border: none;
            border-radius: 10px;
            padding: 11px 28px;
            font-weight: 600;
            font-size: 0.95rem;
            color: #fff;
            transition: background 0.2s, transform 0.1s;
        }

        .btn-save:hover {
            background: #2f6de4;
            color: #fff;
            transform: translateY(-1px);
        }

        .btn-save:active {
            transform: translateY(0);
        }

        .btn-back {
            border-radius: 10px;
            padding: 11px 22px;
            font-weight: 600;
            font-size: 0.95rem;
            border: 1.5px solid #e2e8f0;
            color: #4a5568;
            background: #fff;
            transition: background 0.2s;
            text-decoration: none;
            display: inline-block;
        }

        .btn-back:hover {
            background: #f7fafc;
            color: #2d3748;
        }

        .divider {
            height: 1px;
            background: #edf2f7;
            margin: 28px 0;
        }

        .field-icon {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1rem;
            pointer-events: none;
        }

        .input-wrap {
            position: relative;
        }
    </style>
</head>
<body>

<div class="form-card">
    <h2>📋 Thêm sinh viên</h2>
    <p class="subtitle">Điền đầy đủ thông tin bên dưới để thêm sinh viên mới.</p>
    <div class="divider"></div>

    <form th:action="@{/students/save}"
          th:object="${student}"
          method="post"
          novalidate
          onsubmit="return validateForm()">

        <!-- Họ tên -->
        <div class="mb-3">
            <label for="name">Họ tên <span class="text-danger">*</span></label>
            <div class="input-wrap">
                <input type="text"
                       class="form-control"
                       th:field="*{name}"
                       id="name"
                       placeholder="VD: Nguyễn Văn A"
                       autocomplete="off">
            </div>
            <div class="invalid-feedback" id="nameError"></div>
        </div>

        <!-- Tuổi -->
        <div class="mb-3">
            <label for="age">Tuổi <span class="text-danger">*</span></label>
            <div class="input-wrap">
                <input type="number"
                       class="form-control"
                       th:field="*{age}"
                       id="age"
                       placeholder="VD: 20"
                       min="1" max="100">
            </div>
            <div class="invalid-feedback" id="ageError"></div>
        </div>

        <!-- Email -->
        <div class="mb-3">
            <label for="email">Email <span class="text-danger">*</span></label>
            <div class="input-wrap">
                <input type="text"
                       class="form-control"
                       th:field="*{email}"
                       id="email"
                       placeholder="VD: abc@gmail.com"
                       autocomplete="off">
            </div>
            <div class="invalid-feedback" id="emailError"></div>
        </div>

        <!-- Giới tính -->
        <div class="mb-3">
            <label for="gender">Giới tính <span class="text-danger">*</span></label>
            <select class="form-select" th:field="*{gender}" id="gender">
                <option value="">-- Chọn giới tính --</option>
                <option value="Nam">Nam</option>
                <option value="Nữ">Nữ</option>
            </select>
            <div class="invalid-feedback" id="genderError"></div>
        </div>

        <!-- Lớp -->
        <div class="mb-3">
            <label for="className">Lớp <span class="text-danger">*</span></label>
            <div class="input-wrap">
                <input type="text"
                       class="form-control"
                       th:field="*{className}"
                       id="className"
                       placeholder="VD: CNTT01">
            </div>
            <div class="invalid-feedback" id="classError"></div>
        </div>

        <div class="divider"></div>

        <div class="d-flex gap-3">
            <button type="submit" class="btn btn-save">💾 Lưu sinh viên</button>
            <a href="/students" class="btn-back">← Quay lại</a>
        </div>
    </form>
</div>

<script>
    function showError(inputId, errorId, msg) {
        const input = document.getElementById(inputId);
        const error = document.getElementById(errorId);
        input.classList.remove('is-valid');
        input.classList.add('is-invalid');
        error.textContent = msg;
    }

    function clearError(inputId, errorId) {
        const input = document.getElementById(inputId);
        const error = document.getElementById(errorId);
        input.classList.remove('is-invalid');
        input.classList.add('is-valid');
        error.textContent = '';
    }

    function validateForm() {
        let valid = true;

        // 1. Họ tên
        const name = document.getElementById('name').value.trim();
        if (!name) {
            showError('name', 'nameError', '⚠ Họ tên không được để trống.');
            valid = false;
        } else if (name.length < 2) {
            showError('name', 'nameError', '⚠ Họ tên phải có ít nhất 2 ký tự.');
            valid = false;
        } else {
            clearError('name', 'nameError');
        }

        // 2. Tuổi
        const ageVal = document.getElementById('age').value.trim();
        const age = Number(ageVal);
        if (!ageVal) {
            showError('age', 'ageError', '⚠ Tuổi không được để trống.');
            valid = false;
        } else if (!Number.isInteger(age) || age < 1 || age > 100) {
            showError('age', 'ageError', '⚠ Tuổi phải là số nguyên từ 1 đến 100.');
            valid = false;
        } else {
            clearError('age', 'ageError');
        }

        // 3. Email
        const email = document.getElementById('email').value.trim();
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!email) {
            showError('email', 'emailError', '⚠ Email không được để trống.');
            valid = false;
        } else if (!emailRegex.test(email)) {
            showError('email', 'emailError', '⚠ Email không đúng định dạng (VD: abc@gmail.com).');
            valid = false;
        } else {
            clearError('email', 'emailError');
        }

        // 4. Giới tính
        const gender = document.getElementById('gender').value;
        if (!gender) {
            showError('gender', 'genderError', '⚠ Vui lòng chọn giới tính.');
            valid = false;
        } else {
            clearError('gender', 'genderError');
        }

        // 5. Lớp
        const className = document.getElementById('className').value.trim();
        if (!className) {
            showError('className', 'classError', '⚠ Lớp không được để trống.');
            valid = false;
        } else {
            clearError('className', 'classError');
        }

        return valid;
    }

    // Realtime validate khi blur khỏi ô
    document.getElementById('name').addEventListener('blur', function () {
        const v = this.value.trim();
        if (!v) showError('name', 'nameError', '⚠ Họ tên không được để trống.');
        else if (v.length < 2) showError('name', 'nameError', '⚠ Họ tên phải có ít nhất 2 ký tự.');
        else clearError('name', 'nameError');
    });

    document.getElementById('age').addEventListener('blur', function () {
        const v = this.value.trim();
        const n = Number(v);
        if (!v) showError('age', 'ageError', '⚠ Tuổi không được để trống.');
        else if (!Number.isInteger(n) || n < 1 || n > 100) showError('age', 'ageError', '⚠ Tuổi phải là số nguyên từ 1 đến 100.');
        else clearError('age', 'ageError');
    });

    document.getElementById('email').addEventListener('blur', function () {
        const v = this.value.trim();
        const regex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!v) showError('email', 'emailError', '⚠ Email không được để trống.');
        else if (!regex.test(v)) showError('email', 'emailError', '⚠ Email không đúng định dạng (VD: abc@gmail.com).');
        else clearError('email', 'emailError');
    });

    document.getElementById('gender').addEventListener('change', function () {
        if (!this.value) showError('gender', 'genderError', '⚠ Vui lòng chọn giới tính.');
        else clearError('gender', 'genderError');
    });

    document.getElementById('className').addEventListener('blur', function () {
        if (!this.value.trim()) showError('className', 'classError', '⚠ Lớp không được để trống.');
        else clearError('className', 'classError');
    });
</script>

</body>
</html>
