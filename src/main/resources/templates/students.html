<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Danh sách sinh viên</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">

    <h2 class="text-center text-primary mb-4">DANH SÁCH SINH VIÊN</h2>

    <!-- FORM TÌM KIẾM -->
    <form class="row g-3 mb-4" method="get" action="/students">
        <div class="col-md-8">
            <input type="text" name="keyword" class="form-control"
                   placeholder="Nhập tên sinh viên..."
                   th:value="${keyword}">
        </div>
        <div class="col-md-4">
            <button class="btn btn-primary w-100">🔍 Tìm kiếm</button>
        </div>
    </form>

    <!-- BẢNG SINH VIÊN -->
    <div class="card shadow">
        <div class="card-body">
            <table class="table table-bordered table-hover text-center align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Họ tên</th>
                        <th>Tuổi</th>
                        <th>Email</th>
                        <th>Giới tính</th>
                        <th>Chi tiết</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="sv : ${students}">
                        <td th:text="${sv.id}"></td>
                        <td th:text="${sv.name}"></td>
                        <td th:text="${sv.age}"></td>
                        <td th:text="${sv.email}"></td>
                        <td th:text="${sv.gender}"></td>
                        <td>
                            <a class="btn btn-sm btn-info"
                               th:href="@{'/students/' + ${sv.id}}">
                                Xem
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

</body>
</html>
