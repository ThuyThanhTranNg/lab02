<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Sửa sinh viên</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light">
    <div class="container mt-5">
      <h2 class="text-center text-warning mb-4">SỬA THÔNG TIN SINH VIÊN</h2>

      <form
        th:action="@{/students/update}"
        th:object="${student}"
        method="post"
        class="card p-4 shadow"
      >
        <!-- ID ẨN -->
        <input type="hidden" th:field="*{id}" />

        <div class="mb-3">
          <label>Họ tên</label>
          <input type="text" th:field="*{name}" class="form-control" required />
        </div>

        <div class="mb-3">
          <label>Tuổi</label>
          <input
            type="number"
            th:field="*{age}"
            class="form-control"
            required
          />
        </div>

        <div class="mb-3">
          <label>Email</label>
          <input type="email" th:field="*{email}" class="form-control" />
        </div>

        <div class="mb-3">
          <label>Giới tính</label>
          <select th:field="*{gender}" class="form-select">
            <option value="Nam">Nam</option>
            <option value="Nữ">Nữ</option>
          </select>
        </div>
        <div class="mb-3">
          <label>Lớp</label>
          <input
            type="text"
            th:field="*{className}"
            class="form-control"
            placeholder="VD: CNTT01"
            required
          />
        </div>

        <button class="btn btn-warning w-100">💾 Cập nhật</button>
      </form>
    </div>
  </body>
</html>
